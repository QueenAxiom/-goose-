<title>Good Morning — Sofia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#eee;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:560px;width:100%;background:#111;border:1px solid #2a2a2a;border-radius:16px;overflow:hidden;box-shadow:0 12px 48px rgba(204,0,0,.15)}
.face{width:100%;height:320px;object-fit:cover;object-position:top;display:block}
.body{padding:28px}
h1{font-size:26px;margin-bottom:6px}
h1 .red{color:#c00}
.sub{color:#888;font-size:14px;margin-bottom:20px}
h2{font-size:15px;letter-spacing:2px;color:#c00;margin:20px 0 12px}
.check{display:flex;gap:12px;align-items:flex-start;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.check input{margin-top:3px;accent-color:#c00;width:18px;height:18px}
.check b{display:block;font-size:15px}
.check span{font-size:13px;color:#999}
.check.done{opacity:.45}
.check.done b{text-decoration:line-through}
.foot{text-align:center;font-size:11px;color:#555;padding:14px;border-top:1px solid #222}
</style>

<script>
var checks=[
["Colibri — is the brain awake?","Windows key, type PowerShell, run: curl http://127.0.0.1:8000/v1/models — answers with a model name."],
["Hookup — is ECC drafting free?","In the ECC window: ECC, hookup check — draft one sentence through the local model at 127.0.0.1:8000 and tell me which model wrote it."],
["n8n — are the hands moving?","Open http://localhost:5678 — the editor loads."],
["Dashboard — can we see the empire?","Open Mission Control, click all five tabs — every tab loads."]
];
var box=document.getElementById('checks');
checks.forEach(function(c,i){
var d=document.createElement('label');d.className='check';
d.innerHTML='<input type="checkbox"><div><b>'+(i+1)+'. '+c[0]+'</b><span>'+c[1]+'</span></div>';
d.querySelector('input').onchange=function(){d.classList.toggle('done',this.checked);};
