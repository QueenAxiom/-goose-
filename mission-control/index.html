<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom Mission Control</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>AXIOM</h1><span class="sub">Mission Control — private. For your eyes only.</span>
  <div class="badges">
    <span class="badge" id="badgeStripe">Stripe: …</span>
    <span class="badge" id="badgeSites">Sites: …</span>
    <span class="badge" id="badgeVoice">Voice: …</span>
    <button class="badge mode" id="modeToggle" title="Text: type everywhere (quiet, for crowded rooms). Voice: mic buttons dictate into any box and replies are spoken.">Input: Text</button>
  </div>
</header>
<nav class="main" id="mainNav"></nav>
<div class="banner" id="councilBanner" style="display:none"></div>
<main>
  <section class="pane" id="pane-next"><div class="scroll" id="nextRoot"></div></section>
  <section class="pane" id="pane-sites">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <button id="btnLive">Live</button>
      <button id="btnStaging" class="active">Staging</button>
      <a id="adminLink" href="#" target="_blank" rel="noopener">open wp-admin ↗</a>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="Site preview"></iframe>
      <div class="blocked" id="blocked">
        <div>This site doesn't allow being shown inside Mission Control.</div>
        <a class="btn" id="openSite" href="#" target="_blank" rel="noopener">Open in a new tab ↗</a>
      </div>
    </div>
    <div class="cmd">
      <div class="out" id="out"></div>
      <div class="row">
        <textarea id="prompt" maxlength="2000" placeholder="Tell ECC what to change on this site. Enter sends, Shift+Enter for a new line."></textarea>
        <button class="btn mic" id="micPrompt" title="Dictate">🎤</button>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="row">
        <span id="target"></span>
        <label id="liveConfirmRow" class="warn-text" style="display:none"><input type="checkbox" id="confirmLive"> I confirm this change goes to the LIVE site</label>
      </div>
    </div>
  </section>
  <section class="pane" id="pane-council"><div class="scroll" id="councilRoot"></div></section>
  <section class="pane" id="pane-posts"><div class="scroll" id="postsRoot"></div></section>
  <section class="pane" id="pane-sales"><div class="scroll" id="salesRoot"></div></section>
  <section class="pane" id="pane-voice"><div class="scroll" id="voiceRoot"></div></section>
  <section class="pane" id="pane-system"><div class="scroll" id="systemRoot"></div></section>
</main>
<script>window.MC_TOKEN = "__MC_TOKEN__";</script>
<script src="/app.js"></script>
</body>
</html>
